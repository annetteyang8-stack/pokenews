<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Centre</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1e;
    --text-dim: #6e6e76;
    --accent: #d1453b;
    --accent-dim: #f7dcda;
    --preorder: #3a6ea5;
    --preorder-dim: #dce8f4;
    --restock: #3a8a5d;
    --restock-dim: #dcf0e4;
    --medium: #b5820a;
    --medium-dim: #f7ecd2;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --surface: #212228;
      --border: #34353c;
      --text: #eceded;
      --text-dim: #9a9ba3;
      --accent: #e5716a;
      --accent-dim: #3a2523;
      --preorder: #6ea3d8;
      --preorder-dim: #1f2b38;
      --restock: #6bc294;
      --restock-dim: #1c3327;
      --medium: #d8ab4f;
      --medium-dim: #3a3120;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.app-header {
    padding: 20px 28px 0;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 14px;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  nav.tabs button {
    border: none;
    background: transparent;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  nav.subtabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  nav.subtabs button {
    border: none;
    background: transparent;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.subtabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .alert-dot {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 4px;
  }
  .alert-dot.flash {
    display: inline-block;
    animation: alert-pulse 1s ease-in-out infinite;
  }
  @keyframes alert-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .finding-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .finding-card .finding-title {
    font-weight: 600;
    font-size: 14px;
  }
  .finding-card .finding-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .finding-card .finding-snippet {
    font-size: 13px;
    margin-top: 6px;
  }
  .subtab-content {
    display: none;
  }
  .subtab-content.active {
    display: block;
  }
  main {
    padding: 24px 28px 60px;
    max-width: 1100px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-card .label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 4px;
  }
  section.panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  section.panel h2 {
    font-size: 15px;
    margin: 0 0 14px;
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    align-items: end;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .pill.preorder { background: var(--preorder-dim); color: var(--preorder); }
  .pill.restock { background: var(--restock-dim); color: var(--restock); }
  .pill.likelihood-low { background: var(--border); color: var(--text-dim); }
  .pill.likelihood-medium { background: var(--medium-dim); color: var(--medium); }
  .pill.likelihood-high { background: var(--restock-dim); color: var(--restock); }
  .likelihood-card {
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .likelihood-card.likelihood-low { background: var(--bg); }
  .likelihood-card.likelihood-medium { background: var(--medium-dim); }
  .likelihood-card.likelihood-high { background: var(--restock-dim); }
  .likelihood-card .likelihood-tier {
    font-size: 26px;
    font-weight: 700;
  }
  .likelihood-card .likelihood-explanation {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
  }
  .delete-btn:hover { color: var(--accent); }
  .empty-note {
    color: var(--text-dim);
    font-size: 13px;
    padding: 10px 0;
  }
  #predictionTable td > div + div {
    margin-top: 4px;
  }
  .toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 12px;
  }
</style>

<script>

async function sb(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const SUPPLIER_COSTCO_WEST = 'Costco Canada (West)';
const SUPPLIER_POKEMON_CENTER = 'Pokémon Center';

let knownReleases = [];
let purchases = [];
let costcoSightings = [];
let pokeCenterFindings = [];
let pokeCenterStatus = { last_checked_at: null, last_changed_at: null };
let editingReleaseId = null;
let editingSightingId = null;

async function loadKnownReleasesFromDB() {
  const rows = await sb('known_releases?select=*&order=release_date.asc');
  knownReleases = rows.map(r => ({ id: r.id, name: r.name, date: r.release_date }));

async function insertRelease(r) {

function findKnownRelease(name) {
  const target = (name || '').trim().toLowerCase();
  return knownReleases.find(r => r.name.toLowerCase() === target);
}

function daysBetween(dateA, dateB) {
  const a = new Date(dateA + 'T00:00:00Z');
  const b = new Date(dateB + 'T00:00:00Z');
  return Math.round((b - a) / 86400000);
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function predictRestockDate(releaseDate) {
  // Earliest date 30-60 days before release that falls on Mon/Tue/Wed/Thu.
  for (let offset = 60; offset >= 30; offset--) {
    const candidate = addDays(releaseDate, -offset);
    const dow = new Date(candidate + 'T00:00:00Z').getUTCDay();
    if (dow >= 1 && dow <= 4) return candidate;
  }
  return addDays(releaseDate, -60);
}

// Costco Canada restock likelihood: real sighting history (primary signal) blended with
// coarse seasonal context (secondary signal). Not a predicted date — Costco doesn't publish
// a restock schedule, so this is intentionally a Low/Medium/High read on "right now."
const COSTCO_HEAVY_MONTHS = [8, 9, 10, 11]; // Sep-Dec (0-indexed)
const COSTCO_EASTER_MONTHS = [2, 3]; // Mar-Apr (0-indexed)

function weeksBetween(dateA, dateB) {
  return daysBetween(dateA, dateB) / 7;
}

function computeCostcoLikelihood() {
  const today = new Date().toISOString().slice(0, 10);
  const month = new Date(today + 'T00:00:00Z').getUTCMonth();

  const seasonalTier = COSTCO_HEAVY_MONTHS.includes(month) ? 'High'
    : COSTCO_EASTER_MONTHS.includes(month) ? 'Medium'
    : 'Low';

  const observedLags = costcoSightings
    .filter(s => s.set)
    .map(s => {
      const known = findKnownRelease(s.set);
      return known ? { weeks: weeksBetween(known.date, s.sightedDate), releaseName: known.name, item: s.item } : null;
    })
    .filter(Boolean);

  const hotMatches = [];
  knownReleases.forEach(r => {
    const weeksSince = weeksBetween(r.date, today);
    if (weeksSince < 0) return;
    observedLags.forEach(lag => {
      if (Math.abs(weeksSince - lag.weeks) <= 1) {
        hotMatches.push({ release: r, weeksSince, matchedPattern: lag });
      }
    });
  });

  const hasRealSignal = hotMatches.length > 0;
  let tier;
  if (hasRealSignal) {
    tier = seasonalTier === 'Low' ? 'Medium' : 'High';
  } else {
    tier = seasonalTier === 'High' ? 'Medium' : seasonalTier;
  }

  return { tier, seasonalTier, hasRealSignal, hotMatches, sightingCount: costcoSightings.length, month };
}

function costcoLikelihoodExplanation({ seasonalTier, hasRealSignal, hotMatches, sightingCount, month }) {
  const parts = [];
  const monthName = MONTH_NAMES[month];
  if (seasonalTier === 'High') {
    parts.push(`${monthName} is historically one of Costco's heaviest Pokémon stocking months (Sep–Dec)`);
  } else if (seasonalTier === 'Medium') {
    parts.push(`${monthName} is in the smaller Easter-season bump (Mar–Apr)`);
  } else {
    parts.push(`${monthName} is historically a quieter month for Costco Pokémon stock`);
  }

  if (hasRealSignal) {
    const names = [...new Set(hotMatches.map(m => m.release.name))];
    parts.push(`this week's timing matches a previously observed restock lag for ${names.join(', ')}`);
  } else if (sightingCount > 0) {
    parts.push(`no known release currently matches a previously observed restock timing (based on ${sightingCount} sighting${sightingCount === 1 ? '' : 's'} logged so far)`);
  } else {
    parts.push('no sighting history logged yet to cross-check against');
  }
  return parts.join(' — ');
}

function offsetForEntry(p) {
  const known = findKnownRelease(p.set);
  if (!known) return null;
  if (p.type === 'preorder') {
    return daysBetween(p.transactionDate, known.date); // positive = days before release
  }
  return daysBetween(known.date, p.transactionDate); // positive = days after release
}

function stdDev(arr, mean) {
  if (arr.length < 2) return 0;
  const variance = arr.reduce((sum, v) => sum + (v - mean) ** 2, 0) / (arr.length - 1);
  return Math.sqrt(variance);
}

function confidenceLabel(n) {
  if (n >= 4) return 'High';
  if (n >= 2) return 'Medium';
  return 'Low';
}

function supplierStats() {
  const map = {};
  purchases.forEach(p => {
    const offset = offsetForEntry(p);
    if (offset === null) return;
    if (!map[p.supplier]) map[p.supplier] = { preorder: [], restock: [] };
    map[p.supplier][p.type].push(offset);
  });
  const stats = {};
  Object.entries(map).forEach(([supplier, groups]) => {
    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    const preorderAvg = avg(groups.preorder);
    const restockAvg = avg(groups.restock);
    stats[supplier] = {
      preorderAvg,
      preorderCount: groups.preorder.length,
      preorderStdDev: stdDev(groups.preorder, preorderAvg),
      restockAvg,
      restockCount: groups.restock.length,
      restockStdDev: stdDev(groups.restock, restockAvg)
    };
  });
  return stats;
}

function renderStatRow() {
  const totalSpend = purchases.reduce((sum, p) => sum + (Number(p.price) || 0), 0);
  const suppliers = new Set(purchases.map(p => p.supplier)).size;
  const el = document.getElementById('statRow');
  el.innerHTML = `
    <div class="stat-card"><div class="label">Total purchases</div><div class="value">${purchases.length}</div></div>
    <div class="stat-card"><div class="label">Suppliers tracked</div><div class="value">${suppliers}</div></div>
    <div class="stat-card"><div class="label">Total spend</div><div class="value">$${totalSpend.toFixed(2)}</div></div>
  `;
}

function setOptionsHtml(selectedSet) {
  const sorted = [...knownReleases].sort((a, b) => b.date.localeCompare(a.date));
  return '<option value="">— doesn\'t match a set —</option>' +
    sorted.map(r => `<option value="${escapeHtml(r.name)}" ${r.name === selectedSet ? 'selected' : ''}>${escapeHtml(r.name)} (${fmtDate(r.date)})</option>`).join('');
}

function renderOtherSupplierSelect() {
  const historical = [...new Set(purchases.map(p => p.supplier))];
  const otherSuppliers = historical
    .filter(s => s !== SUPPLIER_COSTCO_WEST && s !== SUPPLIER_POKEMON_CENTER)
    .sort();
  const otherSelect = document.getElementById('p-other-supplier');
  const currentOther = otherSelect.value;
  otherSelect.innerHTML = otherSuppliers.length
    ? otherSuppliers.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')
    : '<option value="">No other suppliers yet</option>';
  if (otherSuppliers.includes(currentOther)) otherSelect.value = currentOther;
}

function updateFocusVisibility() {
  const focus = document.getElementById('p-focus').value;
  document.getElementById('p-other-supplier-wrap').style.display = focus === 'other' ? '' : 'none';
}

function renderSupplierSummary() {
  const stats = supplierStats();
  const el = document.getElementById('supplierSummary');
  const entries = Object.entries(stats);
  if (!entries.length) {
    el.innerHTML = '<div class="empty-note">Log a few purchases to see supplier averages here.</div>';
    return;
  }
  el.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Supplier</th>
          <th>Avg preorder lead time</th>
          <th>Avg restock lag time</th>
        </tr>
      </thead>
      <tbody>
        ${entries.map(([supplier, s]) => `
          <tr>
            <td>${escapeHtml(supplier)}</td>
            <td>${s.preorderCount ? `${s.preorderAvg.toFixed(1)} ± ${s.preorderStdDev.toFixed(1)} days before release <span class="pill preorder">${confidenceLabel(s.preorderCount)} · n=${s.preorderCount}</span>` : '<span class="empty-note">no data</span>'}</td>
            <td>${s.restockCount ? `${s.restockAvg.toFixed(1)} ± ${s.restockStdDev.toFixed(1)} days after release <span class="pill restock">${confidenceLabel(s.restockCount)} · n=${s.restockCount}</span>` : '<span class="empty-note">no data</span>'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderYearSelect() {
  const select = document.getElementById('p-year');
  const years = [...new Set(knownReleases.map(r => r.date.slice(0, 4)))].sort();
  const current = select.value;
  select.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
  const thisYear = String(new Date().getFullYear());
  if (years.includes(current)) select.value = current;
  else if (years.includes(thisYear)) select.value = thisYear;
}

function normalizeSupplierName(s) {
  return (s || '')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .trim()
    .toLowerCase();
}

function supplierEmptyInsight(supplier, type) {
  const exact = purchases.filter(p => p.supplier === supplier);
  const typeExact = exact.filter(p => p.type === type);
  const normalizedTarget = normalizeSupplierName(supplier);
  const similar = purchases.filter(p => p.supplier !== supplier && normalizeSupplierName(p.supplier) === normalizedTarget);
  return {
    totalExact: exact.length,
    typeExact: typeExact.length,
    similarCount: similar.length,
    similarNames: [...new Set(similar.map(p => p.supplier))]
  };
}

function supplierEmptyMessage(supplier, type, insight) {
  if (insight.similarCount > 0) {
    return `Found ${insight.similarCount} purchase${insight.similarCount === 1 ? '' : 's'} logged under a slightly different supplier name ("${escapeHtml(insight.similarNames.join('", "'))}") — rename to exactly "${escapeHtml(supplier)}" so it counts.`;
  }
  if (insight.totalExact === 0) {
    return `No purchases logged for ${escapeHtml(supplier)} yet.`;
  }
  if (insight.typeExact === 0) {
    return `You have ${insight.totalExact} ${escapeHtml(supplier)} purchase${insight.totalExact === 1 ? '' : 's'} logged, but none marked as ${type}.`;
  }
  return `You have ${insight.typeExact} ${type} purchase${insight.typeExact === 1 ? '' : 's'} for ${escapeHtml(supplier)}, but the item name${insight.typeExact === 1 ? '' : 's'} didn't match a known product — check spelling against the item list.`;
}

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function seasonalPattern(supplier) {
  const months = purchases
    .filter(p => p.supplier === supplier)
    .map(p => new Date(p.transactionDate + 'T00:00:00Z').getUTCMonth());
  const active = [...new Set(months)].sort((a, b) => a - b);
  const quiet = MONTH_NAMES.map((_, i) => i).filter(i => !active.includes(i));
  return {
    count: months.length,
    active: active.map(i => MONTH_NAMES[i]),
    quiet: quiet.map(i => MONTH_NAMES[i])
  };
}

function renderSeasonalSummary(supplier) {
  const el = document.getElementById('seasonalSummary');
  if (!supplier) {
    el.innerHTML = '';
    return;
  }
  const { count, active, quiet } = seasonalPattern(supplier);
  if (!count) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `
    <div class="empty-note">
      Based on <strong>${count}</strong> purchase${count === 1 ? '' : 's'} logged for ${escapeHtml(supplier)} —
      historically active months: <strong>${active.join(', ')}</strong>.
      ${quiet.length ? `Quiet months: ${quiet.join(', ')}.` : ''}
    </div>
  `;
}

function focusConfig() {
  const focus = document.getElementById('p-focus').value;
  if (focus === 'costco') return { supplier: SUPPLIER_COSTCO_WEST, type: 'restock' };
  if (focus === 'pokemoncenter') return { supplier: SUPPLIER_POKEMON_CENTER, type: 'preorder' };
  return { supplier: document.getElementById('p-other-supplier').value, type: 'restock' };
}

function renderPredictionTable() {
  const { supplier, type } = focusConfig();
  const year = document.getElementById('p-year').value;
  const el = document.getElementById('predictionTable');
  const costcoEl = document.getElementById('costcoView');

  if (supplier === SUPPLIER_COSTCO_WEST) {
    document.getElementById('seasonalSummary').innerHTML = '';
    el.style.display = 'none';
    costcoEl.style.display = '';
    renderCostcoView();
    return;
  }
  el.style.display = '';
  costcoEl.style.display = 'none';

  renderSeasonalSummary(supplier);

  if (!supplier) {
    el.innerHTML = '<div class="empty-note">Log a restock purchase from another supplier to see this view.</div>';
    return;
  }

  const stats = supplierStats()[supplier];
  const avgKey = type + 'Avg';
  const countKey = type + 'Count';
  const stdDevKey = type + 'StdDev';
  const releases = knownReleases
    .filter(r => r.date.slice(0, 4) === year)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (!releases.length) {
    el.innerHTML = '<div class="empty-note">No known Pokémon product releases for this year.</div>';
    return;
  }

  const typeLabel = type === 'preorder' ? 'preorder open' : 'restock';
  const emptyMsg = (!stats || !stats[countKey])
    ? supplierEmptyMessage(supplier, type, supplierEmptyInsight(supplier, type))
    : '';

  const newReleaseRowHtml = editingReleaseId === '__new__'
    ? `
      <tr data-id="__new__">
        <td><input type="text" class="edit-release-name" value=""></td>
        <td><input type="date" class="edit-release-date" value="${year}-01-01"></td>
        <td><span class="empty-note">—</span></td>
        <td><button class="secondary release-save-btn" data-id="__new__">Save</button> <button class="secondary release-cancel-btn" data-id="__new__">Cancel</button></td>
      </tr>
    `
    : '';

  el.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Official release date</th>
          <th>Predicted ${typeLabel} date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${newReleaseRowHtml}
        ${releases.map(r => {
          const isEditing = editingReleaseId === r.id;
          const productCell = isEditing
            ? `<input type="text" class="edit-release-name" value="${escapeHtml(r.name)}">`
            : escapeHtml(r.name);
          const dateCell = isEditing
            ? `<input type="date" class="edit-release-date" value="${r.date}">`
            : fmtDate(r.date);
          const actionsCell = isEditing
            ? `<button class="secondary release-save-btn" data-id="${r.id}">Save</button> <button class="secondary release-cancel-btn" data-id="${r.id}">Cancel</button>`
            : `<button class="secondary release-edit-btn" data-id="${r.id}">Edit</button> <button class="delete-btn release-delete-btn" data-id="${r.id}" title="Delete">✕</button>`;

          if (type === 'restock') {
            const predicted = predictRestockDate(r.date);
            return `
              <tr data-id="${r.id}">
                <td>${productCell}</td>
                <td>${dateCell}</td>
                <td>${fmtDate(predicted)}</td>
                <td>${actionsCell}</td>
              </tr>
            `;
          }
          const n = stats ? stats[countKey] : 0;
          if (!n) {
            return `
              <tr data-id="${r.id}">
                <td>${productCell}</td>
                <td>${dateCell}</td>
                <td><span class="empty-note">${emptyMsg}</span></td>
                <td>${actionsCell}</td>
              </tr>
            `;
          }
          const avgVal = stats[avgKey];
          const sd = Math.round(stats[stdDevKey]);
          const predicted = addDays(r.date, -Math.round(avgVal));
          const rangeLabel = sd > 0 ? ` (±${sd}d)` : '';
          return `
            <tr data-id="${r.id}">
              <td>${productCell}</td>
              <td>${dateCell}</td>
              <td>${fmtDate(predicted)}${rangeLabel}</td>
              <td>${actionsCell}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;

  el.querySelectorAll('.release-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingReleaseId = btn.dataset.id;
      renderPredictionTable();
    });
  });
  el.querySelectorAll('.release-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingReleaseId = null;
      renderPredictionTable();
    });
  });
  el.querySelectorAll('.release-save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const row = btn.closest('tr');
      const newName = row.querySelector('.edit-release-name').value.trim();
      const newDate = row.querySelector('.edit-release-date').value;
      if (!newName || !newDate) {
        alert('Product name and official release date are required.');
        return;
      }
      btn.disabled = true;
      try {
        if (id === '__new__') {
          const created = await insertRelease({ name: newName, date: newDate });
          knownReleases.push(created);
        } else {
          const existing = knownReleases.find(r => r.id === id);
          const oldName = existing.name;
          await updateRelease(id, { name: newName, date: newDate });
          existing.name = newName;
          existing.date = newDate;
          if (oldName !== newName) {
            // Postgres cascades the rename to purchases.set_name (ON UPDATE CASCADE) —
            // refetch so the local copy reflects it.
            await loadPurchasesFromDB();
          }
        }
        editingReleaseId = null;
        renderAll();
      } catch (err) {
        alert('Could not save: ' + err.message);
        btn.disabled = false;
      }
    });
  });
  el.querySelectorAll('.release-delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      btn.disabled = true;
      try {
        await deleteRelease(id);
        knownReleases = knownReleases.filter(r => r.id !== id);
        if (editingReleaseId === id) editingReleaseId = null;
        // Postgres cascades the delete to SET NULL on purchases.set_name — refetch to reflect it.
        await loadPurchasesFromDB();
        renderAll();
      } catch (err) {
        alert('Could not delete: ' + err.message);
        btn.disabled = false;
      }
    });
  });
}

const POKECENTER_ACK_KEY = 'commandCentre.pokemon.pokecenterAcked';

function renderPokeCenterWatch() {
  const metaEl = document.getElementById('pokecenterMeta');
  const listEl = document.getElementById('pokecenterFindings');
  const dot = document.getElementById('pokecenterAlertDot');

  const lastChecked = pokeCenterStatus.last_checked_at;
  const lastChanged = pokeCenterStatus.last_changed_at;

  metaEl.innerHTML = lastChecked
    ? `Last checked: <strong>${fmtDateTime(lastChecked)}</strong>${lastChanged ? ` · Last change detected: <strong>${fmtDateTime(lastChanged)}</strong>` : ''}`
    : 'No checks have run yet.';

  if (!pokeCenterFindings.length) {
    listEl.innerHTML = '<div class="empty-note">No findings yet. This fills in once the scheduled watch routine runs.</div>';
  } else {
    listEl.innerHTML = pokeCenterFindings.map(f => `
      <div class="finding-card">
        <div class="finding-title"><a href="${escapeHtml(f.url)}" target="_blank" rel="noopener">${escapeHtml(f.title)}</a></div>
        <div class="finding-meta">${escapeHtml(f.source || '')} · detected ${fmtDateTime(f.detected_at)}</div>
        ${f.snippet ? `<div class="finding-snippet">${escapeHtml(f.snippet)}</div>` : ''}
      </div>
    `).join('');
  }

  const acked = localStorage.getItem(POKECENTER_ACK_KEY);
  const isNew = lastChanged && (!acked || new Date(lastChanged) > new Date(acked));
  dot.classList.toggle('flash', !!isNew);
}

function acknowledgePokeCenterWatch() {
  if (pokeCenterStatus.last_changed_at) {
    localStorage.setItem(POKECENTER_ACK_KEY, pokeCenterStatus.last_changed_at);
  }
  document.getElementById('pokecenterAlertDot').classList.remove('flash');
}

function sightingEditCells(s) {
  return `
    <td><input type="date" class="edit-sighting-date" value="${s.sightedDate}"></td>
    <td><input type="text" class="edit-sighting-item" value="${escapeHtml(s.item)}"></td>
    <td><input type="text" class="edit-sighting-region" value="${escapeHtml(s.region || '')}" placeholder="e.g. BC"></td>
    <td><input type="text" class="edit-sighting-location" value="${escapeHtml(s.locationType || '')}" placeholder="e.g. in-warehouse"></td>
    <td><select class="edit-sighting-set">${setOptionsHtml(s.set)}</select></td>
    <td>
      <button class="secondary sighting-save-btn" data-id="${s.id}">Save</button>
      <button class="secondary sighting-cancel-btn" data-id="${s.id}">Cancel</button>
    </td>
  `;
}

function renderCostcoView() {
  const el = document.getElementById('costcoView');
  const likelihood = computeCostcoLikelihood();
  const explanation = costcoLikelihoodExplanation(likelihood);
  const tierClass = `likelihood-${likelihood.tier.toLowerCase()}`;

  const sightingsSorted = [...costcoSightings].sort((a, b) => b.sightedDate.localeCompare(a.sightedDate));

  const newRowHtml = editingSightingId === '__new__'
    ? `<tr data-id="__new__">${sightingEditCells({
        id: '__new__', sightedDate: new Date().toISOString().slice(0, 10), item: '', region: '', locationType: '', set: ''
      })}</tr>`
    : '';

  el.innerHTML = `
    <div class="likelihood-card ${tierClass}">
      <div class="label">This week's Costco Canada (West) restock likelihood</div>
      <div class="likelihood-tier"><span class="pill ${tierClass}">${likelihood.tier}</span></div>
      <div class="likelihood-explanation">${escapeHtml(explanation)}</div>
    </div>
    <div class="toolbar">
      <button class="primary" id="addSightingBtn">Add sighting</button>
    </div>
    <h2 style="font-size:14px;margin:0 0 10px;">Restock sighting log</h2>
    <div class="empty-note" style="padding-bottom:8px;">Real sightings — yours or reported elsewhere, any region — feed the likelihood model above. Not every sighting needs to be a personal purchase.</div>
    ${(!sightingsSorted.length && !newRowHtml) ? '<div class="empty-note">No sightings logged yet.</div>' : `
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Item</th>
          <th>Region</th>
          <th>Location</th>
          <th>Set</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${newRowHtml}
        ${sightingsSorted.map(s => {
          if (s.id === editingSightingId) {
            return `<tr data-id="${s.id}">${sightingEditCells(s)}</tr>`;
          }
          return `
            <tr data-id="${s.id}">
              <td>${fmtDate(s.sightedDate)}</td>
              <td>${escapeHtml(s.item)}</td>
              <td>${s.region ? escapeHtml(s.region) : '<span class="empty-note">—</span>'}</td>
              <td>${s.locationType ? escapeHtml(s.locationType) : '<span class="empty-note">—</span>'}</td>
              <td>${s.set ? escapeHtml(s.set) : '<span class="empty-note">—</span>'}</td>
              <td>
                <button class="secondary sighting-edit-btn" data-id="${s.id}">Edit</button>
                <button class="delete-btn" data-id="${s.id}" title="Delete">✕</button>
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
    `}
  `;

  document.getElementById('addSightingBtn').addEventListener('click', () => {
    editingSightingId = '__new__';
    renderCostcoView();
  });
  el.querySelectorAll('.sighting-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingSightingId = btn.dataset.id;
      renderCostcoView();
    });
  });
  el.querySelectorAll('.sighting-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingSightingId = null;
      renderCostcoView();
    });
  });
  el.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await deleteSighting(btn.dataset.id);
        costcoSightings = costcoSightings.filter(s => s.id !== btn.dataset.id);
        renderCostcoView();
      } catch (err) {
        alert('Could not delete: ' + err.message);
        btn.disabled = false;
      }
    });
  });
  el.querySelectorAll('.sighting-save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const row = btn.closest('tr');
      const sightedDate = row.querySelector('.edit-sighting-date').value;
      const item = row.querySelector('.edit-sighting-item').value.trim();
      const region = row.querySelector('.edit-sighting-region').value.trim();
      const locationType = row.querySelector('.edit-sighting-location').value.trim();
      const set = row.querySelector('.edit-sighting-set').value;
      if (!sightedDate || !item) {
        alert('Date and item are required.');
        return;
      }
      btn.disabled = true;
      try {
        if (id === '__new__') {
          const created = await insertSighting({ sightedDate, item, region, locationType, set });
          costcoSightings.push(created);
        } else {
          await updateSighting(id, { sightedDate, item, region, locationType, set });
          Object.assign(costcoSightings.find(s => s.id === id), { sightedDate, item, region, locationType, set });
        }
        editingSightingId = null;
        renderCostcoView();
      } catch (err) {
        alert('Could not save: ' + err.message);
        btn.disabled = false;
      }
    });
  });
}

function renderAll() {
  renderStatRow();
  renderYearSelect();
  renderOtherSupplierSelect();
  updateFocusVisibility();
  renderSupplierSummary();
  renderPredictionTable();
  renderPokeCenterWatch();
}

document.getElementById('addReleaseBtn').addEventListener('click', () => {
  editingReleaseId = '__new__';
  renderPredictionTable();
});

document.getElementById('p-focus').addEventListener('change', () => {
  editingReleaseId = null;
  updateFocusVisibility();
  renderPredictionTable();
});
document.getElementById('p-other-supplier').addEventListener('change', () => {
  editingReleaseId = null;
  renderPredictionTable();
});
document.getElementById('p-year').addEventListener('change', () => {
  editingReleaseId = null;
  renderPredictionTable();
});
document.getElementById('refreshPredictBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshPredictBtn');
  btn.disabled = true;
  try {
    await Promise.all([loadKnownReleasesFromDB(), loadPurchasesFromDB(), loadCostcoSightingsFromDB(), loadPokeCenterData()]);
    renderAll();
  } catch (err) {
    alert('Could not refresh: ' + err.message);
  } finally {
    btn.disabled = false;
  }
});

document.querySelectorAll('nav.subtabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.subtabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.subtab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`subtab-${btn.dataset.subtab}`).classList.add('active');
    if (btn.dataset.subtab === 'pokecenter') acknowledgePokeCenterWatch();
  });
});

(async () => {
  try {
    await Promise.all([loadKnownReleasesFromDB(), loadPurchasesFromDB(), loadCostcoSightingsFromDB(), loadPokeCenterData()]);
  } catch (err) {
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;">Failed to load data from Supabase: ${escapeHtml(err.message)}</div>`);
  }
  renderAll();
})();
</script>
