<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Centre</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1e;
    --text-dim: #6e6e76;
    --accent: #d1453b;
    --accent-dim: #f7dcda;
    --preorder: #3a6ea5;
    --preorder-dim: #dce8f4;
    --restock: #3a8a5d;
    --restock-dim: #dcf0e4;
    --medium: #b5820a;
    --medium-dim: #f7ecd2;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --surface: #212228;
      --border: #34353c;
      --text: #eceded;
      --text-dim: #9a9ba3;
      --accent: #e5716a;
      --accent-dim: #3a2523;
      --preorder: #6ea3d8;
      --preorder-dim: #1f2b38;
      --restock: #6bc294;
      --restock-dim: #1c3327;
      --medium: #d8ab4f;
      --medium-dim: #3a3120;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.app-header {
    padding: 20px 28px 0;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 14px;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  nav.tabs button {
    border: none;
    background: transparent;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  nav.subtabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  nav.subtabs button {
    border: none;
    background: transparent;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.subtabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .alert-dot {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 4px;
  }
  .alert-dot.flash {
    display: inline-block;
    animation: alert-pulse 1s ease-in-out infinite;
  }
  @keyframes alert-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .finding-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .finding-card .finding-title {
    font-weight: 600;
    font-size: 14px;
  }
  .finding-card .finding-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .finding-card .finding-snippet {
    font-size: 13px;
    margin-top: 6px;
  }
  .subtab-content {
    display: none;
  }
  .subtab-content.active {
    display: block;
  }
  main {
    padding: 24px 28px 60px;
    max-width: 1100px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-card .label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 4px;
  }
  section.panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  section.panel h2 {
    font-size: 15px;
    margin: 0 0 14px;
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    align-items: end;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .pill.preorder { background: var(--preorder-dim); color: var(--preorder); }
  .pill.restock { background: var(--restock-dim); color: var(--restock); }
  .pill.likelihood-low { background: var(--border); color: var(--text-dim); }
  .pill.likelihood-medium { background: var(--medium-dim); color: var(--medium); }
  .pill.likelihood-high { background: var(--restock-dim); color: var(--restock); }
  .likelihood-card {
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .likelihood-card.likelihood-low { background: var(--bg); }
  .likelihood-card.likelihood-medium { background: var(--medium-dim); }
  .likelihood-card.likelihood-high { background: var(--restock-dim); }
  .likelihood-card .likelihood-tier {
    font-size: 26px;
    font-weight: 700;
  }
  .likelihood-card .likelihood-explanation {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .region-block {
    margin-bottom: 20px;
  }
  .region-block h3 {
    font-size: 13px;
    margin: 0 0 8px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .likelihood-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
  }
  .likelihood-grid .likelihood-card {
    margin-bottom: 0;
    padding: 12px 14px;
  }
  .likelihood-grid .likelihood-tier {
    font-size: 18px;
  }
  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
  }
  .delete-btn:hover { color: var(--accent); }
  .empty-note {
    color: var(--text-dim);
    font-size: 13px;
    padding: 10px 0;
  }
  .toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 12px;
  }
</style>

<script>

async function sb(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

let knownReleases = [];
let purchases = [];
let costcoSightings = [];
let pokeCenterFindings = [];
let pokeCenterStatus = { last_checked_at: null, last_changed_at: null };
let editingSightingId = null;

async function loadKnownReleasesFromDB() {
  const rows = await sb('known_releases?select=*&order=release_date.asc');
  knownReleases = rows.map(r => ({ id: r.id, name: r.name, date: r.release_date }));
}

async function loadPurchasesFromDB() {
  const rows = await sb('purchases?select=*&order=transaction_date.desc');
  purchases = rows.map(r => ({
    id: r.id, supplier: r.supplier, item: r.item, set: r.set_name,

async function loadCostcoSightingsFromDB() {
  const rows = await sb('costco_restock_sightings?select=*&order=sighted_date.desc');
  costcoSightings = rows.map(r => ({
    id: r.id, sightedDate: r.sighted_date, item: r.item, region: r.region,
    locationType: r.location_type, set: r.set_name, notes: r.notes

}

async function insertSighting(s) {
  const [row] = await sb('costco_restock_sightings', {
    method: 'POST',
    headers: { Prefer: 'return=representation' },
    body: JSON.stringify([{
      sighted_date: s.sightedDate, item: s.item, region: s.region || null,
      location_type: s.locationType || null, set_name: s.set || null, notes: s.notes || null
    }])
  });
  return {
    id: row.id, sightedDate: row.sighted_date, item: row.item, region: row.region,
    locationType: row.location_type, set: row.set_name, notes: row.notes
  };
}

async function updateSighting(id, s) {
  await sb(`costco_restock_sightings?id=eq.${id}`, {
    method: 'PATCH',
    body: JSON.stringify({
      sighted_date: s.sightedDate, item: s.item, region: s.region || null,
      location_type: s.locationType || null, set_name: s.set || null, notes: s.notes || null
    })
  });
}

async function deleteSighting(id) {
  await sb(`costco_restock_sightings?id=eq.${id}`, { method: 'DELETE' });
}

async function loadPokeCenterData() {
  const [findings, statusRows] = await Promise.all([
    sb('pokemon_center_findings?select=*&order=detected_at.desc&limit=30'),
    sb('pokemon_center_status?select=*&limit=1')
  ]);
  pokeCenterFindings = findings;
  pokeCenterStatus = statusRows[0] || { last_checked_at: null, last_changed_at: null };
}

function findKnownRelease(name) {
  const target = (name || '').trim().toLowerCase();
  return knownReleases.find(r => r.name.toLowerCase() === target);
}

function daysBetween(dateA, dateB) {
  const a = new Date(dateA + 'T00:00:00Z');
  const b = new Date(dateB + 'T00:00:00Z');
  return Math.round((b - a) / 86400000);
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
// Costco Canada restock likelihood: real sighting history (primary signal, filtered per
// region — plus any sighting with no region logged, treated as generically applicable)
// blended with coarse seasonal context (secondary signal). Not a predicted date — Costco
// doesn't publish a restock schedule, so this is intentionally a Low/Medium/High read.
const COSTCO_HEAVY_MONTHS = [8, 9, 10, 11]; // Sep-Dec (0-indexed)
const COSTCO_EASTER_MONTHS = [2, 3]; // Mar-Apr (0-indexed)

function weeksBetween(dateA, dateB) {
  return daysBetween(dateA, dateB) / 7;
}

function computeCostcoLikelihood(region, evalDate) {
  const month = new Date(evalDate + 'T00:00:00Z').getUTCMonth();

  const seasonalTier = COSTCO_HEAVY_MONTHS.includes(month) ? 'High'
    : COSTCO_EASTER_MONTHS.includes(month) ? 'Medium'
    : 'Low';

  const observedLags = costcoSightings
    .filter(s => s.set && (!s.region || s.region === region))
    .map(s => {
      const known = findKnownRelease(s.set);
      return known ? { weeks: weeksBetween(known.date, s.sightedDate), releaseName: known.name } : null;
    })
    .filter(Boolean);

  const hotMatches = [];
  knownReleases.forEach(r => {
    const weeksSince = weeksBetween(r.date, evalDate);
    if (weeksSince < 0) return;
    observedLags.forEach(lag => {
      if (Math.abs(weeksSince - lag.weeks) <= 1) {
        hotMatches.push({ release: r, weeksSince, matchedPattern: lag });
      }
    });
  });

  const hasRealSignal = hotMatches.length > 0;
  let tier;
  if (hasRealSignal) {
    tier = seasonalTier === 'Low' ? 'Medium' : 'High';
  } else {
    tier = seasonalTier === 'High' ? 'Medium' : seasonalTier;
  }

  return { tier, seasonalTier, hasRealSignal, hotMatches, sightingCount: observedLags.length, month };
}

function costcoLikelihoodExplanation({ seasonalTier, hasRealSignal, hotMatches, sightingCount, month }) {
  const monthName = MONTH_NAMES[month];
  if (hasRealSignal) {
    const names = [...new Set(hotMatches.map(m => m.release.name))];
    return `Matches a previously observed restock lag for ${names.join(', ')}`;
  }
  if (seasonalTier === 'High') return `${monthName}: historically a heavy stocking month`;
  if (seasonalTier === 'Medium') return `${monthName}: smaller Easter-season bump`;
  if (sightingCount > 0) return `${monthName}: quiet month, no lag match (n=${sightingCount})`;
  return `${monthName}: no sighting history for this region yet`;
}

function offsetForEntry(p) {
  const known = findKnownRelease(p.set);
  if (!known) return null;
  if (p.type === 'preorder') {
    return daysBetween(p.transactionDate, known.date); // positive = days before release
  }
  return daysBetween(known.date, p.transactionDate); // positive = days after release
}

function stdDev(arr, mean) {
  if (arr.length < 2) return 0;
  const variance = arr.reduce((sum, v) => sum + (v - mean) ** 2, 0) / (arr.length - 1);
  return Math.sqrt(variance);
}

function confidenceLabel(n) {
  if (n >= 4) return 'High';
  if (n >= 2) return 'Medium';
  return 'Low';
}

function supplierStats() {
  const map = {};
  purchases.forEach(p => {
    const offset = offsetForEntry(p);
    if (offset === null) return;
    if (!map[p.supplier]) map[p.supplier] = { preorder: [], restock: [] };
    map[p.supplier][p.type].push(offset);
  });
  const stats = {};
  Object.entries(map).forEach(([supplier, groups]) => {
    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    const preorderAvg = avg(groups.preorder);
    const restockAvg = avg(groups.restock);
    stats[supplier] = {
      preorderAvg,
      preorderCount: groups.preorder.length,
      preorderStdDev: stdDev(groups.preorder, preorderAvg),
      restockAvg,
      restockCount: groups.restock.length,
      restockStdDev: stdDev(groups.restock, restockAvg)
    };
  });
  return stats;
}

function setOptionsHtml(selectedSet) {
  const sorted = [...knownReleases].sort((a, b) => b.date.localeCompare(a.date));
  return '<option value="">— doesn\'t match a set —</option>' +
    sorted.map(r => `<option value="${escapeHtml(r.name)}" ${r.name === selectedSet ? 'selected' : ''}>${escapeHtml(r.name)} (${fmtDate(r.date)})</option>`).join('');
}


function renderSupplierSummary() {
  const stats = supplierStats();
  const el = document.getElementById('supplierSummary');
  const entries = Object.entries(stats);
  if (!entries.length) {
    el.innerHTML = '<div class="empty-note">Log a few purchases to see supplier averages here.</div>';
    return;
  }
  el.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Supplier</th>
          <th>Avg preorder lead time</th>
          <th>Avg restock lag time</th>
        </tr>
      </thead>
      <tbody>
        ${entries.map(([supplier, s]) => `
          <tr>
            <td>${escapeHtml(supplier)}</td>
            <td>${s.preorderCount ? `${s.preorderAvg.toFixed(1)} ± ${s.preorderStdDev.toFixed(1)} days before release <span class="pill preorder">${confidenceLabel(s.preorderCount)} · n=${s.preorderCount}</span>` : '<span class="empty-note">no data</span>'}</td>
            <td>${s.restockCount ? `${s.restockAvg.toFixed(1)} ± ${s.restockStdDev.toFixed(1)} days after release <span class="pill restock">${confidenceLabel(s.restockCount)} · n=${s.restockCount}</span>` : '<span class="empty-note">no data</span>'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const POKECENTER_ACK_KEY = 'commandCentre.pokemon.pokecenterAcked';

function renderPokeCenterWatch() {
  const metaEl = document.getElementById('pokecenterMeta');
  const listEl = document.getElementById('pokecenterFindings');
  const dot = document.getElementById('pokecenterAlertDot');

  const lastChecked = pokeCenterStatus.last_checked_at;
  const lastChanged = pokeCenterStatus.last_changed_at;

  metaEl.innerHTML = lastChecked
    ? `Last checked: <strong>${fmtDateTime(lastChecked)}</strong>${lastChanged ? ` · Last change detected: <strong>${fmtDateTime(lastChanged)}</strong>` : ''}`
    : 'No checks have run yet.';

  if (!pokeCenterFindings.length) {
    listEl.innerHTML = '<div class="empty-note">No findings yet. This fills in once the scheduled watch routine runs.</div>';
  } else {
    listEl.innerHTML = pokeCenterFindings.map(f => `
      <div class="finding-card">
        <div class="finding-title"><a href="${escapeHtml(f.url)}" target="_blank" rel="noopener">${escapeHtml(f.title)}</a></div>
        <div class="finding-meta">${escapeHtml(f.source || '')} · detected ${fmtDateTime(f.detected_at)}</div>
        ${f.snippet ? `<div class="finding-snippet">${escapeHtml(f.snippet)}</div>` : ''}
      </div>
    `).join('');
  }

  const acked = localStorage.getItem(POKECENTER_ACK_KEY);
  const isNew = lastChanged && (!acked || new Date(lastChanged) > new Date(acked));
  dot.classList.toggle('flash', !!isNew);
}

function acknowledgePokeCenterWatch() {
  if (pokeCenterStatus.last_changed_at) {
    localStorage.setItem(POKECENTER_ACK_KEY, pokeCenterStatus.last_changed_at);
  }
  document.getElementById('pokecenterAlertDot').classList.remove('flash');
}

function sightingEditCells(s) {
  return `
    <td><input type="date" class="edit-sighting-date" value="${s.sightedDate}"></td>
    <td><input type="text" class="edit-sighting-item" value="${escapeHtml(s.item)}"></td>
    <td><input type="text" class="edit-sighting-region" value="${escapeHtml(s.region || '')}" placeholder="e.g. BC"></td>
    <td><input type="text" class="edit-sighting-location" value="${escapeHtml(s.locationType || '')}" placeholder="e.g. in-warehouse"></td>
    <td><select class="edit-sighting-set">${setOptionsHtml(s.set)}</select></td>
    <td>
      <button class="secondary sighting-save-btn" data-id="${s.id}">Save</button>
      <button class="secondary sighting-cancel-btn" data-id="${s.id}">Cancel</button>
    </td>
  `;
}

function likelihoodCardHtml(label, result) {
  const tierClass = `likelihood-${result.tier.toLowerCase()}`;
  const explanation = costcoLikelihoodExplanation(result);
  return `
    <div class="likelihood-card ${tierClass}">
      <div class="label">${escapeHtml(label)}</div>
      <div class="likelihood-tier"><span class="pill ${tierClass}">${result.tier}</span></div>
      <div class="likelihood-explanation">${escapeHtml(explanation)}</div>
    </div>
  `;
}

function renderCostcoView() {
  const el = document.getElementById('costcoView');
  const today = new Date().toISOString().slice(0, 10);
  const horizons = [
    { label: 'This week', date: today },
    { label: 'Next week', date: addDays(today, 7) },
    { label: 'Next month', date: addDays(today, 30) }
  ];

  const regionBlocks = ['BC', 'ON'].map(region => `
    <div class="region-block">
      <h3>Costco ${region}</h3>
      <div class="likelihood-grid">
        ${horizons.map(h => likelihoodCardHtml(h.label, computeCostcoLikelihood(region, h.date))).join('')}
      </div>
    </div>
  `).join('');

  const sightingsSorted = [...costcoSightings].sort((a, b) => b.sightedDate.localeCompare(a.sightedDate));

  const newRowHtml = editingSightingId === '__new__'
    ? `<tr data-id="__new__">${sightingEditCells({
        id: '__new__', sightedDate: new Date().toISOString().slice(0, 10), item: '', region: '', locationType: '', set: ''
      })}</tr>`
    : '';

  el.innerHTML = `
    ${regionBlocks}
    <div class="toolbar">
      <button class="primary" id="addSightingBtn">Add sighting</button>
    </div>
    <h2 style="font-size:14px;margin:0 0 10px;">Restock sighting log</h2>
    <div class="empty-note" style="padding-bottom:8px;">Real sightings — yours or reported elsewhere, any region — feed the likelihood model above. Not every sighting needs to be a personal purchase.</div>
    ${(!sightingsSorted.length && !newRowHtml) ? '<div class="empty-note">No sightings logged yet.</div>' : `
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Item</th>
          <th>Region</th>
          <th>Location</th>
          <th>Set</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${newRowHtml}
        ${sightingsSorted.map(s => {
          if (s.id === editingSightingId) {
            return `<tr data-id="${s.id}">${sightingEditCells(s)}</tr>`;
          }
          return `
            <tr data-id="${s.id}">
              <td>${fmtDate(s.sightedDate)}</td>
              <td>${escapeHtml(s.item)}</td>
              <td>${s.region ? escapeHtml(s.region) : '<span class="empty-note">—</span>'}</td>
              <td>${s.locationType ? escapeHtml(s.locationType) : '<span class="empty-note">—</span>'}</td>
              <td>${s.set ? escapeHtml(s.set) : '<span class="empty-note">—</span>'}</td>
              <td>
                <button class="secondary sighting-edit-btn" data-id="${s.id}">Edit</button>
                <button class="delete-btn" data-id="${s.id}" title="Delete">✕</button>
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
    `}
  `;

  document.getElementById('addSightingBtn').addEventListener('click', () => {
    editingSightingId = '__new__';
    renderCostcoView();
  });
  el.querySelectorAll('.sighting-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingSightingId = btn.dataset.id;
      renderCostcoView();
    });
  });
  el.querySelectorAll('.sighting-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingSightingId = null;
      renderCostcoView();
    });
  });
  el.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await deleteSighting(btn.dataset.id);
        costcoSightings = costcoSightings.filter(s => s.id !== btn.dataset.id);
        renderCostcoView();
      } catch (err) {
        alert('Could not delete: ' + err.message);
        btn.disabled = false;
      }
    });
  });
  el.querySelectorAll('.sighting-save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const row = btn.closest('tr');
      const sightedDate = row.querySelector('.edit-sighting-date').value;
      const item = row.querySelector('.edit-sighting-item').value.trim();
      const region = row.querySelector('.edit-sighting-region').value.trim();
      const locationType = row.querySelector('.edit-sighting-location').value.trim();
      const set = row.querySelector('.edit-sighting-set').value;
      if (!sightedDate || !item) {
        alert('Date and item are required.');
        return;
      }
      btn.disabled = true;
      try {
        if (id === '__new__') {
          const created = await insertSighting({ sightedDate, item, region, locationType, set });
          costcoSightings.push(created);
        } else {
          await updateSighting(id, { sightedDate, item, region, locationType, set });
          Object.assign(costcoSightings.find(s => s.id === id), { sightedDate, item, region, locationType, set });
        }
        editingSightingId = null;
        renderCostcoView();
      } catch (err) {
        alert('Could not save: ' + err.message);
        btn.disabled = false;
      }
    });
  });
}

function renderAll() {
  renderSupplierSummary();
  renderCostcoView();
  renderPokeCenterWatch();
}

document.getElementById('refreshPredictBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshPredictBtn');
  btn.disabled = true;
  try {
    await Promise.all([loadKnownReleasesFromDB(), loadPurchasesFromDB(), loadCostcoSightingsFromDB(), loadPokeCenterData()]);
    renderAll();
  } catch (err) {
    alert('Could not refresh: ' + err.message);
  } finally {
    btn.disabled = false;
  }
});

document.querySelectorAll('nav.subtabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.subtabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.subtab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`subtab-${btn.dataset.subtab}`).classList.add('active');
    if (btn.dataset.subtab === 'pokecenter') acknowledgePokeCenterWatch();
  });
});

(async () => {
  try {
    await Promise.all([loadKnownReleasesFromDB(), loadPurchasesFromDB(), loadCostcoSightingsFromDB(), loadPokeCenterData()]);
  } catch (err) {
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;">Failed to load data from Supabase: ${escapeHtml(err.message)}</div>`);
  }
  renderAll();
})();
</script>
</body>
</html>
